# LiteLLM Proxy · 8 家模型统一入口
# 核心原则：国内 5 家一律用通用 openai/ 适配器 + api_base。
# 不用 dashscope/ zhipu/ minimax/ 这些专用适配器 —— 它们随版本改名，升级就炸。

model_list:
  # ==================== 国内（OpenAI 兼容端点）====================
  - model_name: ds-chat
    litellm_params:
      model: openai/deepseek-chat
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info: { mode: chat, supports_function_calling: true }

  - model_name: ds-reasoner
    litellm_params:
      model: openai/deepseek-reasoner
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info: { mode: chat, supports_function_calling: true }

  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: qwen-vl
    litellm_params:
      model: openai/qwen-vl-max
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: glm-4.6
    litellm_params:
      model: openai/glm-4.6
      api_base: https://open.bigmodel.cn/api/paas/v4
      api_key: os.environ/ZHIPU_API_KEY

  # MiniMax 的 model id 换得勤，以控制台为准（如 MiniMax-M2 / abab6.5s-chat）
  - model_name: minimax
    litellm_params:
      model: openai/MiniMax-M2
      api_base: https://api.minimax.chat/v1
      api_key: os.environ/MINIMAX_API_KEY

  - model_name: hunyuan
    litellm_params:
      model: openai/hunyuan-turbos-latest
      api_base: https://api.hunyuan.cloud.tencent.com/v1
      api_key: os.environ/HUNYUAN_API_KEY

  # ==================== 海外（官方直连，需 SG/JP 出口）====================
  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  - model_name: grok
    litellm_params:
      model: xai/grok-4
      api_key: os.environ/XAI_API_KEY

router_settings:
  # 一家 429/超时就换下一家，用户几乎无感
  fallbacks:
    - gpt-5: ["glm-4.6", "qwen-plus"]
    - gemini-pro: ["gemini-flash", "qwen-plus"]
    - grok: ["qwen-plus"]
    - ds-reasoner: ["gpt-5-mini", "qwen-plus"]
  retry_after: 5
  num_retries: 2
  timeout: 600
  allowed_fails: 3
  cooldown_time: 30
  # 代码里只写 cheap-extract，将来换更便宜的模型只改这一行
  model_group_alias:
    cheap-extract: ds-chat

litellm_settings:
  drop_params: true          # 推理模型不吃 temperature 之类，自动丢弃，不报错
  set_verbose: false
  json_logs: true
  # 调试记忆注入时打开，生产别开
  # turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # database_url: os.environ/DATABASE_URL   # 打开可做花费统计与虚拟密钥
