              '<option value="">全部角色</option><option value="user">用户</option><option value="admin">管理员</option>' +
            '</select>' +
            '<select class="select" id="lg-ok" style="max-width:130px">' +
              '<option value="">全部结果</option><option value="true">成功</option><option value="false">失败</option>' +
            '</select>' +
            '<input class="input" id="lg-q" placeholder="搜邮箱或 IP" style="flex:1;min-width:160px" value="' + esc(st.q) + '" />' +
            '<button class="btn outline" id="lg-go">筛选</button>' +
          '</div>' +
          '<div class="hint" style="margin-top:10px">IMA 知识库未接入；接入后可对登录记录做语义检索与归纳。</div>' +
        '</div>' +
        '<div class="card">' +
          (rows ? '<table class="tb"><thead><tr><th>时间</th><th>角色</th><th>账号</th><th>结果</th><th>IP</th><th>UA</th></tr></thead><tbody>' + rows + '</tbody></table>'
                : '<div class="empty">没有符合条件的记录</div>') +
        '</div>';

      $('#lg-actor').value = st.actor;
      $('#lg-ok').value = st.ok;
      $('#lg-go').addEventListener('click', function () {
        state.loginsFilter = { actor: $('#lg-actor').value, ok: $('#lg-ok').value, q: $('#lg-q').value.trim() };
        render();
      });
    });
  }

  // ---------------- 模型切换 ----------------
  function viewModels() {
    // 这里复用原有 /api/admin/providers（靠 X-Admin-Token）。
    // 后台已经登录过，但那个接口要的是 ADMIN_TOKEN，所以让用户在这里填一次并记住。
    var at = '';
    try { at = localStorage.getItem('umf:admin-token') || ''; } catch (e) {}

    if (!at) {
      $('#page').innerHTML =
        '<div class="card">' +
          '<div class="card-t">需要管理员口令</div>' +
          '<div class="card-d">厂商密钥由 <code>ADMIN_TOKEN</code> 保护，与后台账号是两把钥匙。填一次会记住。</div>' +
          '<div class="row" style="margin-top:12px">' +
            '<input class="input" id="at" type="password" placeholder="ADMIN_TOKEN" style="flex:1" />' +
            '<button class="btn" id="at-go">载入</button>' +
          '</div>' +
          '<div class="hint" id="at-msg" style="margin-top:8px"></div>' +
        '</div>';
      $('#at-go').addEventListener('click', function () {
        var v = $('#at').value.trim();
        if (!v) return;
        localStorage.setItem('umf:admin-token', v);
        render();
      });
      return Promise.resolve();
    }

    return fetch('/api/admin/providers', { headers: { 'x-admin-token': at } })
      .then(function (r) {
        if (r.status === 401) { localStorage.removeItem('umf:admin-token'); throw new Error('口令不对'); }
        return r.json();
      })
      .then(function (d) {
        var cards = (d.providers || []).map(function (p) {
          var models = (p.models || []).map(function (m) {
            return '<option value="' + esc(m) + '"' + (m === p.model_id ? ' selected' : '') + '>' + esc(m) + '</option>';
          }).join('');
          return '<div class="card" style="margin-top:12px">' +
            '<div class="card-h">' +
              '<div><div class="card-t">' + esc(p.label) + ' <span class="hint mono">' + esc(p.code) + '</span></div>' +
              '<div class="card-d">' + esc(p.base_url) + '</div></div>' +
              '<div class="spacer"></div>' +
              (p.ready ? '<span class="badge ok">就绪</span>' : '<span class="badge warn">未就绪</span>') +
            '</div>' +
            '<div class="row">' +
              '<select class="select" data-code="' + esc(p.code) + '" style="flex:1;min-width:220px">' +
                '<option value="">— 选择模型 —</option>' + models +
              '</select>' +
              '<button class="btn outline" data-fetch="' + esc(p.code) + '">拉取列表</button>' +
              '<button class="btn" data-save="' + esc(p.code) + '">保存</button>' +
            '</div>' +
            (p.last_fetch_error ? '<div class="hint" style="color:var(--destructive)">' + esc(p.last_fetch_error) + '</div>' : '') +
          '</div>';
        }).join('');

        $('#page').innerHTML =
          '<div class="card">' +
            '<div class="card-h"><div><div class="card-t">厂商与模型</div>' +
            '<div class="card-d">用户在聊天里只选厂商；具体型号在这里定</div></div>' +
            '<div class="spacer"></div>' +
            '<button class="btn ghost sm" id="at-reset">换口令</button></div>' +
            cards +
          '</div>';

        $('#at-reset').addEventListener('click', function () {
          localStorage.removeItem('umf:admin-token'); render();
        });

        $$('[data-save]').forEach(function (b) {
          b.addEventListener('click', function () {
            var code = b.dataset.save;
            var sel = $('[data-code="' + code + '"]');
            fetch('/api/admin/providers/' + code, {
              method: 'PATCH',
              headers: { 'x-admin-token': at, 'Content-Type': 'application/json' },
              body: JSON.stringify({ model_id: sel.value, enabled: !!sel.value })
            }).then(function (r) { if (!r.ok) throw new Error('保存失败'); toast('已保存'); render(); })
              .catch(function (e) { toast(e.message); });
          });
        });
        $$('[data-fetch]').forEach(function (b) {
          b.addEventListener('click', function () {
            b.disabled = true; b.textContent = '拉取中…';
            fetch('/api/admin/providers/' + b.dataset.fetch + '/fetch', {
              method: 'POST', headers: { 'x-admin-token': at }
            }).then(function (r) { return r.json(); })
              .then(function (r) { toast(r.ok ? ('拉到 ' + r.count + ' 个') : (r.error || '失败')); render(); })
              .catch(function (e) { toast(e.message); b.disabled = false; });
          });
        });
      })
      .catch(function (e) {
        $('#page').innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
      });
  }

  // ---------------- 账号 ----------------
  function viewAccount() {
    $('#page').innerHTML =
      '<div class="card" style="max-width:520px">' +
        '<div class="card-t">修改密码</div>' +
        '<div class="card-d">改完会踢掉其它设备的会话，需要重新登录。</div>' +
        '<div style="margin-top:14px"><label class="label">原密码</label><input class="input" id="pw-old" type="password" /></div>' +
        '<div style="margin-top:10px"><label class="label">新密码（至少 8 位）</label><input class="input" id="pw-new" type="password" /></div>' +
        '<div style="margin-top:10px"><label class="label">再输一次</label><input class="input" id="pw-new2" type="password" /></div>' +
        '<button class="btn" id="pw-go" style="margin-top:14px">保存</button>' +
      '</div>' +
      '<div class="card" style="max-width:520px">' +
        '<div class="card-t">当前身份</div>' +
        '<dl class="kv" style="margin-top:10px">' +
          '<dt>账号</dt><dd class="mono">' + esc((state.me || {}).username || '') + '</dd>' +
          '<dt>名称</dt><dd>' + esc((state.me || {}).display_name || '') + '</dd>' +
          '<dt>角色</dt><dd>' + ((state.me || {}).is_owner ? 'owner' : 'admin') + '</dd>' +
        '</dl>' +
      '</div>';

    $('#pw-go').addEventListener('click', function () {
      var o = $('#pw-old').value, n = $('#pw-new').value, n2 = $('#pw-new2').value;
      if (n.length < 8) return toast('新密码至少 8 位');
      if (n !== n2) return toast('两次输入不一致');
      api('/api/ops/password', { method: 'POST', body: { old: o, new: n } })
        .then(function () { toast('已修改，请重新登录'); setToken(''); showLogin('密码已更新'); })
        .catch(function (e) { toast(e.message); });
    });
    return Promise.resolve();
  }

  // ---------------- 启动 ----------------
  function boot() {
    if (!token()) { showLogin(''); return; }
    api('/api/ops/me').then(function (me) {
      state.me = me;
      $('#me-name').textContent = me.display_name || me.username;
      showApp();
      route();
    }).catch(function () { showLogin(''); });
  }

  boot();
})();
</script>
</body>
</html>
