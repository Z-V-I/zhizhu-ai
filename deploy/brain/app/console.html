<!doctype html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>知猪管理</title>
<style>
  /* ============================================================
     设计语言：shadcn/ui
     铁律：颜色只走语义 token；圆角从 --radius 单源派生；浮层才用阴影。
     暗色是主场景（和聊天页一致），亮色同步定义，不得只做一套。
     ============================================================ */
  :root {
    --radius: 0.625rem;
    --background: oklch(0.985 0.002 160);
    --foreground: oklch(0.2 0.01 160);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --popover-foreground: oklch(0.145 0 0);
    /* 主色取自主站聊天页的「发送键绿」（LibreChat 的 green-700 / green-500）。
       两个界面并排打开时色相一致，才像同一个产品；
       原来用的是近黑主色，一切按钮都是灰的，和主站没有血缘关系。 */
    --primary: oklch(0.52 0.13 162);
    --primary-foreground: oklch(0.99 0 0);
    --secondary: oklch(0.97 0 0);
    --secondary-foreground: oklch(0.205 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --accent: oklch(0.97 0 0);
    --accent-foreground: oklch(0.205 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --success: oklch(0.55 0.14 155);
    --warning: oklch(0.68 0.15 75);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
    --sidebar: oklch(0.985 0 0);
    --sidebar-foreground: oklch(0.145 0 0);
    --sidebar-accent: oklch(0.97 0 0);
    --sidebar-border: oklch(0.922 0 0);
    --radius-sm: calc(var(--radius) * 0.6);
    --radius-md: calc(var(--radius) * 0.8);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) * 1.4);
    --radius-2xl: calc(var(--radius) * 1.8);
  }
  .dark {
    --background: oklch(0.155 0.006 165);
    --foreground: oklch(0.97 0.004 160);
    --card: oklch(0.196 0.008 165);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.72 0.15 162);
    --primary-foreground: oklch(0.18 0.02 165);
    --secondary: oklch(0.269 0 0);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.25 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --success: oklch(0.72 0.16 155);
    --warning: oklch(0.79 0.15 78);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --sidebar: oklch(0.165 0 0);
    --sidebar-foreground: oklch(0.985 0 0);
    --sidebar-accent: oklch(0.24 0 0);
    --sidebar-border: oklch(1 0 0 / 10%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--background);
    color: var(--foreground);
    font: 14px/1.55 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

  /* ---------- 布局 ---------- */
  /* ★ 必须把高度锁死在这一层。
   * 原来的写法只有 body{height:100%}，#root 是 auto 高度 → .app 的 100% 变成 auto，
   * 整个页面跟着内容一起滚。于是左侧栏底部的「管理员/退出」会随着页面滚动到处跑，
   * 点不同导航（内容长短不一）它就在不同位置 —— 看起来像"跟着导航变"。
   * 现在 #root 撑满视口、.app 用 dvh，主区自己滚，侧栏永远不动。 */
  #root { height: 100%; }
  .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  .sidebar {
    width: 232px; flex: 0 0 232px;
    background: var(--sidebar); color: var(--sidebar-foreground);
    border-right: 1px solid var(--sidebar-border);
    display: flex; flex-direction: column; padding: 12px 10px; gap: 2px;
    height: 100%; overflow: hidden;
  }
  /* 导航自己滚，底部账号区固定。
   * 分成两个盒子而不是只给 .sidebar 加 overflow：那样一滚，底部的「退出」也跟着滚走。 */
  .sidebar-nav {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 2px;
    margin: 0 -4px; padding: 0 4px 4px;
  }
  .sidebar-nav::-webkit-scrollbar { width: 6px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 999px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 6px 6px 14px; }
  /* 品牌标记：直接放站点图标，不再用字母方块 ——
   * 站点图标已经换过一次，字母方块和它并排会像两个不同的产品。 */
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px; flex: 0 0 28px;
    background: transparent; display: block; object-fit: contain;
  }
  .brand-name { font-weight: 600; font-size: 13.5px; letter-spacing: .2px; }
  .brand-sub { color: var(--muted-foreground); font-size: 11px; }

  .nav-group { padding: 10px 8px 4px; color: var(--muted-foreground); font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; }
  .nav-item {
    position: relative;
    display: flex; align-items: center; gap: 9px; padding: 8px 9px;
    border-radius: var(--radius-md); color: var(--sidebar-foreground);
    font-size: 13px; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
    opacity: .78; transition: background .12s, opacity .12s;
  }
  .nav-item:hover { background: var(--sidebar-accent); opacity: 1; }
  /* 选中态：主色淡底 + 左侧 2px 指示条。
   * 只用底色的话，暗色主题下和 hover 几乎分不出来。 */
  .nav-item.on { background: var(--sidebar-accent); opacity: 1; font-weight: 500; }
  .nav-item.on::before {
    content: ''; position: absolute; left: -6px; top: 50%; translate: 0 -50%;
    width: 2px; height: 16px; border-radius: 2px; background: var(--primary);
  }
  .nav-item.on svg { color: var(--primary); opacity: 1; }
  .nav-item svg { flex: 0 0 16px; opacity: .85; }
  .nav-item .count {
    margin-left: auto; font-size: 10.5px; color: var(--muted-foreground);
    background: var(--secondary); padding: 1px 6px; border-radius: 999px;
  }
  .sidebar-foot {
    flex: 0 0 auto; margin-top: 6px;
    border-top: 1px solid var(--sidebar-border); padding-top: 10px;
    background: var(--sidebar);
  }
  .who { display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 12px; }
  .who .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--success); }
  .who-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- 主区 ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 54px; flex: 0 0 54px; display: flex; align-items: center; gap: 12px;
    padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--background);
  }
  .topbar h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .1px; }
  .topbar .desc { color: var(--muted-foreground); font-size: 12px; }
  .spacer { flex: 1; }
  .scroll { flex: 1; overflow-y: auto; }
  .page { max-width: 1180px; margin: 0 auto; padding: 22px 20px 80px; }

  /* ---------- 基础组件 ---------- */
  /* 卡片学主站消息气泡的处理：细边框 + 一层几乎看不见的阴影。
   * 重投影会让后台看起来像 2015 年的 bootstrap 面板。 */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 18px;
    box-shadow: 0 1px 2px oklch(0 0 0 / 4%);
  }
  .card + .card { margin-top: 14px; }
  .card-h { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .card-t { font-size: 13.5px; font-weight: 600; }
  .card-d { font-size: 12px; color: var(--muted-foreground); margin-top: 2px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: var(--radius-md);
    font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
    border: 1px solid transparent; background: var(--primary); color: var(--primary-foreground);
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 12%), 0 1px 2px oklch(0 0 0 / 8%);
    transition: filter .12s, transform .06s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(.5px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.outline { background: transparent; color: var(--foreground); border-color: var(--border); }
  .btn.outline:hover { background: var(--accent); }
  .btn.ghost { background: transparent; color: var(--foreground); }
  .btn.ghost:hover { background: var(--accent); }
  .btn.destructive { background: transparent; color: var(--destructive); border-color: var(--border); }
  .btn.destructive:hover { background: color-mix(in oklab, var(--destructive) 12%, transparent); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: var(--radius-sm); }
  .btn.icon { height: 30px; width: 30px; padding: 0; }

  .input, .select, textarea.input {
    width: 100%; height: 34px; padding: 0 11px;
    background: var(--background); color: var(--foreground);
    border: 1px solid var(--input); border-radius: var(--radius-md);
    font: inherit; font-size: 13px; outline: none;
  }
  textarea.input { height: auto; padding: 9px 11px; resize: vertical; line-height: 1.6; }
  .input:focus, .select:focus, textarea.input:focus { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent); }
  .label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 6px; }
  .hint { color: var(--muted-foreground); font-size: 11.5px; margin-top: 5px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 15px 16px; }
  .stat-k { font-size: 11.5px; color: var(--muted-foreground); }
  .stat-v { font-size: 24px; font-weight: 600; letter-spacing: -.4px; margin-top: 3px; line-height: 1.15; }

  .badge {
    display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px;
    border-radius: var(--radius-sm); font-size: 11px; font-weight: 500;
    background: var(--secondary); color: var(--secondary-foreground); border: 1px solid transparent;
  }
  .badge.ok { color: var(--success); background: color-mix(in oklab, var(--success) 14%, transparent); }
  .badge.warn { color: var(--warning); background: color-mix(in oklab, var(--warning) 14%, transparent); }
  .badge.bad { color: var(--destructive); background: color-mix(in oklab, var(--destructive) 14%, transparent); }
  .badge.outline { background: transparent; border-color: var(--border); color: var(--muted-foreground); }

  table.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tb th {
    text-align: left; font-weight: 500; font-size: 11.5px; color: var(--muted-foreground);
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.tb td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.tb tr:last-child td { border-bottom: none; }
  table.tb tbody tr:hover { background: color-mix(in oklab, var(--muted) 55%, transparent); }
  .empty { text-align: center; padding: 34px 12px; color: var(--muted-foreground); font-size: 13px; }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab {
    background: none; border: none; cursor: pointer; color: var(--muted-foreground);
    padding: 9px 13px; font-size: 13px; border-bottom: 2px solid transparent;
    margin-bottom: -1px; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  }
  .tab:hover { color: var(--foreground); background: var(--accent); }
  .tab.on { color: var(--foreground); border-bottom-color: var(--foreground); font-weight: 500; }

  .chip {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: color-mix(in oklab, var(--foreground) 8%, transparent);
    color: var(--muted-foreground); margin-right: 5px;
  }
  .chip.identity { color: oklch(0.7 0.14 265); background: color-mix(in oklab, oklch(0.7 0.14 265) 16%, transparent); }
  .chip.preference { color: oklch(0.72 0.15 155); background: color-mix(in oklab, oklch(0.72 0.15 155) 16%, transparent); }
  .chip.experience { color: oklch(0.75 0.14 75); background: color-mix(in oklab, oklch(0.75 0.14 75) 16%, transparent); }
  .chip.activity { color: oklch(0.72 0.15 25); background: color-mix(in oklab, oklch(0.72 0.15 25) 16%, transparent); }
  .chip.context { color: var(--muted-foreground); }

  .msg { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .msg:last-child { border-bottom: none; }
  .msg-role { flex: 0 0 62px; font-size: 11px; color: var(--muted-foreground); padding-top: 2px; }
  .msg-role.user { color: var(--foreground); font-weight: 500; }
  .msg-body { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .msg-main { white-space: pre-wrap; word-break: break-word; }
  .msg-think { margin-top: 8px; }
  .msg-think summary {
    cursor: pointer; font-size: 12px; opacity: .65; user-select: none;
  }
  .msg-think > div {
    margin-top: 6px; padding: 8px 10px; border-radius: 8px;
    background: rgba(255,255,255,.04); font-size: 12.5px; opacity: .8;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg-err {
    margin-top: 8px; padding: 8px 10px; border-radius: 8px;
    background: rgba(220,80,80,.12); color: #e88;
    font-size: 12.5px; white-space: pre-wrap;
  }
  .msg-empty { opacity: .45; font-size: 13px; }
  .msg-time { color: var(--muted-foreground); font-size: 10.5px; margin-top: 4px; }

  /* ---------- 问 AI：聊天区 ----------
   * 左历史 / 右对话两块，高度固定在卡片内（不跟页面一起滚），
   * 消息列表自己滚 —— 这样输入框永远贴着底部，像聊天软件而不是表单。 */
  .ima-chat {
    display: grid; grid-template-columns: 196px 1fr;
    padding: 0; overflow: hidden; height: min(68vh, 620px); min-height: 420px;
  }
  .ima-side {
    display: flex; flex-direction: column; min-height: 0;
    border-right: 1px solid var(--border);
    background: color-mix(in oklab, var(--muted) 35%, transparent);
  }
  .ima-side-h {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 10px 8px; flex: 0 0 auto;
  }
  .ima-side-h .card-t { font-size: 12px; }
  .ima-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 6px 10px; }
  .ima-item {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 7px 8px; margin-bottom: 2px; border: none; background: none; cursor: pointer;
    border-radius: var(--radius-md); color: var(--foreground);
    font-size: 12.5px; text-align: left; line-height: 1.35;
  }
  .ima-item:hover { background: var(--accent); }
  .ima-item.on { background: var(--secondary); font-weight: 500; }
  .ima-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ima-item .x {
    flex: 0 0 auto; opacity: 0; font-size: 14px; line-height: 1;
    padding: 2px 4px; border-radius: 4px; color: var(--muted-foreground);
  }
  .ima-item:hover .x { opacity: .7; }
  .ima-item .x:hover { opacity: 1; color: var(--destructive); background: color-mix(in oklab, var(--destructive) 14%, transparent); }

  .ima-main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .ima-msgs {
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  .ima-turn { display: flex; flex-direction: column; max-width: 100%; }
  .ima-turn.user { align-items: flex-end; }
  .ima-bubble {
    max-width: 84%; padding: 9px 13px; border-radius: 14px;
    font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
  }
  .ima-turn.user .ima-bubble {
    background: var(--primary); color: var(--primary-foreground);
    border-bottom-right-radius: 4px;
  }
  .ima-turn.ai .ima-bubble {
    max-width: 94%; background: var(--secondary); color: var(--secondary-foreground);
    border-bottom-left-radius: 4px;
  }
  .ima-turn.ai .ima-bubble.pending { color: var(--muted-foreground); }
  .ima-src {
    margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
    font-size: 11px; color: var(--muted-foreground);
  }
  .ima-src .chip { margin: 0; }
  .ima-compose {
    flex: 0 0 auto; border-top: 1px solid var(--border);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .ima-compose .ta {
    width: 100%; min-height: 42px; max-height: 140px; resize: none;
    padding: 10px 11px; font: inherit; font-size: 13px; line-height: 1.6;
    background: var(--background); color: var(--foreground);
    border: 1px solid var(--input); border-radius: var(--radius-md); outline: none;
  }
  .ima-compose .ta:focus {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--ring) 22%, transparent);
  }
  .ima-compose-bar { display: flex; align-items: center; gap: 8px; }
  .ima-hint { font-size: 11px; color: var(--muted-foreground); }

  @media (max-width: 860px) {
    .ima-chat { grid-template-columns: 1fr; height: min(72vh, 560px); }
    .ima-side { display: none; }
    .ima-chat.show-list .ima-side { display: flex; }
    .ima-chat.show-list .ima-main { display: none; }
  }

  .kv { display: grid; grid-template-columns: 96px 1fr; gap: 7px 12px; font-size: 12.5px; }
  .kv dt { color: var(--muted-foreground); }
  .kv dd { margin: 0; word-break: break-word; }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(6px);
    background: var(--popover); color: var(--popover-foreground);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: 9px 15px; font-size: 13px; box-shadow: 0 8px 24px oklch(0 0 0 / 24%);
    opacity: 0; pointer-events: none; transition: .18s; z-index: 80;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 登录页 */
  .login-wrap { display: grid; place-items: center; height: 100%; padding: 20px; }
  .login-card {
    width: 100%; max-width: 366px; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius-2xl);
    padding: 30px 26px; box-shadow: 0 20px 60px oklch(0 0 0 / 18%);
  }
  .login-card h2 { margin: 14px 0 4px; font-size: 17px; font-weight: 600; }

  .hidden { display: none !important; }
  .mono-cell { font-family: ui-monospace, monospace; font-size: 12px; }
  .wrap-any { word-break: break-all; }

  @media (max-width: 860px) {
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: none; box-shadow: 0 0 0 100vmax oklch(0 0 0 / 45%); }
    .page { padding: 16px 14px 70px; }
    .only-mobile { display: inline-flex !important; }
  }
  .only-mobile { display: none; }
</style>
<!--UMAMI-->
</head>
<body>
<div id="root">
  <!-- 登录 -->
  <div class="login-wrap" id="login-view">
    <div class="login-card">
      <div class="brand" style="padding:0">
        <img class="brand-mark" src="/icons/logo-256.png" alt="知猪" />
        <div>
          <div class="brand-name">知猪管理</div>
          <div class="brand-sub">仅管理员</div>
        </div>
      </div>
      <h2>登录</h2>
      <p class="hint" style="margin:0 0 18px">管理用户、追踪对话、查看登录记录</p>
      <div style="margin-bottom:12px">
        <label class="label" for="u">账号</label>
        <input class="input" id="u" autocomplete="username" />
      </div>
      <div style="margin-bottom:16px">
        <label class="label" for="p">密码</label>
        <input class="input" id="p" type="password" autocomplete="current-password" />
      </div>
      <button class="btn" id="login-btn" style="width:100%">进入</button>
      <div class="hint" id="login-msg" style="margin-top:12px"></div>
    </div>
  </div>

  <!-- 主界面 -->
  <div class="app hidden" id="app-view">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/icons/logo-256.png" alt="知猪" />
        <div>
          <div class="brand-name">知猪管理</div>
          <div class="brand-sub">管理后台</div>
        </div>
      </div>

      <div class="sidebar-nav" id="sidebar-nav">
        <div class="nav-group">总览</div>
        <button class="nav-item on" data-view="dashboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4" /> <path d="M3.34 19a10 10 0 1 1 17.32 0" /></svg>
          概览
        </button>

        <div class="nav-group">用户</div>
        <button class="nav-item" data-view="users">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /> <path d="M16 3.128a4 4 0 0 1 0 7.744" /> <path d="M22 21v-2a4 4 0 0 0-3-3.87" /> <circle cx="9" cy="7" r="4" /></svg>
          用户管理
          <span class="count" id="nav-users">–</span>
        </button>
        <button class="nav-item" data-view="invites">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" /> <path d="M13 5v2" /> <path d="M13 17v2" /> <path d="M13 11v2" /></svg>
          邀请码
          <span class="count" id="nav-invites">–</span>
        </button>

        <div class="nav-group">洞察</div>
        <button class="nav-item" data-view="logins">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></svg>
          登录记录
        </button>

        <div class="nav-group">配置</div>
        <button class="nav-item" data-view="models">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20v2" /> <path d="M12 2v2" /> <path d="M17 20v2" /> <path d="M17 2v2" /> <path d="M2 12h2" /> <path d="M2 17h2" /> <path d="M2 7h2" /> <path d="M20 12h2" /> <path d="M20 17h2" /> <path d="M20 7h2" /> <path d="M7 20v2" /> <path d="M7 2v2" /> <rect x="4" y="4" width="16" height="16" rx="2" /> <rect x="8" y="8" width="8" height="8" rx="1" /></svg>
          模型切换
        </button>
        <button class="nav-item" data-view="ai">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 18V5" /> <path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4" /> <path d="M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294" /> <path d="M17.996 5.125a4 4 0 012.526 5.77" /> <path d="M18 18a4 4 0 002-7.465" /> <path d="M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517" /> <path d="M6 18a4 4 0 01-2-7.465" /> <path d="M6.004 5.125a4 4 0 00-2.526 5.77" /></svg>
          AI 管理
        </button>
        <button class="nav-item" data-view="account">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z" /> <circle cx="16.5" cy="7.5" r=".5" fill="currentColor" /></svg>
          账号与密码
        </button>
      </div>

      <div class="sidebar-foot">
        <div class="who">
          <span class="dot"></span>
          <span class="who-name" id="me-name">–</span>
          <button class="btn ghost sm" id="logout" style="margin-left:auto">退出</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <button class="btn ghost icon only-mobile" id="burger" aria-label="菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="page-title">概览</h1>
        </div>
        <div class="spacer"></div>
        <span class="desc" id="page-desc"></span>
        <button class="btn ghost icon" id="theme" title="切换明暗">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
      <div class="scroll"><div class="page" id="page"></div></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------------- 基础设施 ----------------
  var TOKEN_KEY = 'umf:ops';
  var state = { view: 'dashboard', me: null, users: [], invites: [], currentUser: null };

  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function when(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    if (isNaN(d)) return '—';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function ago(ts) {
    if (!ts) return '';
    var s = Math.floor((Date.now() - new Date(ts).getTime()) / 1000);
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    return Math.floor(s / 86400) + ' 天前';
  }

  var toastTimer;
  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('on'); }, 2600);
  }

  /* ---------------------------------------------------------------- 通用编辑框
   *
   * 四个板块（记忆/话题/时间线/画像）的"改一段文字"长得一模一样：
   * 标题 + 多行输入 + 保存/取消。用 prompt() 会丢掉换行、移动端弹不出来，
   * 而且没法告诉站长"这次改动会被当成用户本人的更正"。
   * 所以做一个通用的，回调里拿到新文本。
   */
  function askText(opts) {
    return new Promise(function (resolve) {
      var old = document.getElementById('ask-mask');
      if (old) old.remove();
      var mask = document.createElement('div');
      mask.id = 'ask-mask';
      mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:9999;' +
        'display:flex;align-items:center;justify-content:center;padding:20px';
      mask.innerHTML =
        '<div style="background:var(--bg,#fff);border:1px solid var(--border);border-radius:12px;' +
          'width:min(560px,100%);padding:18px;box-shadow:0 18px 48px rgba(0,0,0,.22)">' +
          '<div style="font-weight:600;font-size:15px;margin-bottom:4px">' + esc(opts.title || '编辑') + '</div>' +
          '<div class="hint" style="margin:0 0 10px">' + esc(opts.hint || '') + '</div>' +
          '<textarea id="ask-ta" class="ta" rows="' + (opts.rows || 4) + '" ' +
            'style="width:100%;font-size:13.5px;line-height:1.7;padding:10px;border-radius:8px;' +
            'border:1px solid var(--border);background:var(--bg);color:inherit;resize:vertical">' +
            esc(opts.value || '') + '</textarea>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">' +
            '<button class="btn ghost sm" id="ask-cancel">取消</button>' +
            '<button class="btn sm" id="ask-ok">保存</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(mask);
      var ta = document.getElementById('ask-ta');
      ta.focus();
      try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
      function done(v) { mask.remove(); resolve(v); }
      document.getElementById('ask-cancel').onclick = function () { done(null); };
      document.getElementById('ask-ok').onclick = function () { done(ta.value); };
      mask.addEventListener('click', function (e) { if (e.target === mask) done(null); });
      mask.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') done(null);
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) done(ta.value);
      });
    });
  }

  function token() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'x-ops-token': token() }, opts.headers || {});
    if (opts.body && typeof opts.body !== 'string') {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(function (r) {
      if (r.status === 401) { setToken(''); showLogin('会话已过期，请重新登录'); throw new Error('unauthorized'); }
      return r.text().then(function (t) {
        var d = null;
        try { d = t ? JSON.parse(t) : null; } catch (e) { d = null; }
        if (!r.ok) throw new Error((d && (d.detail || d.message)) || ('请求失败 ' + r.status));
        return d;
      });
    });
  }

  // ---------------- 主题 ----------------
  function applyTheme() {
    var saved = '';
    try { saved = localStorage.getItem('umf:ops-theme') || ''; } catch (e) {}
    var dark = saved ? saved === 'dark' : true;
    document.documentElement.classList.toggle('dark', dark);
  }
  applyTheme();
  $('#theme').addEventListener('click', function () {
    var dark = !document.documentElement.classList.contains('dark');
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem('umf:ops-theme', dark ? 'dark' : 'light'); } catch (e) {}
  });
  $('#burger').addEventListener('click', function () { $('#sidebar').classList.toggle('open'); });

  // ---------------- 登录 ----------------
  function showLogin(msg) {
    $('#app-view').classList.add('hidden');
    $('#login-view').classList.remove('hidden');
    $('#login-msg').textContent = msg || '';
  }
  function showApp() {
    $('#login-view').classList.add('hidden');
    $('#app-view').classList.remove('hidden');
  }

  $('#login-btn').addEventListener('click', doLogin);
  ['#u', '#p'].forEach(function (sel) {
    $(sel).addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
  });

  function doLogin() {
    var u = $('#u').value.trim(), p = $('#p').value;
    if (!u || !p) return toast('账号和密码都要填');
    $('#login-btn').disabled = true;
    api('/api/ops/auth/login', { method: 'POST', body: { username: u, password: p } })
      .then(function (d) {
        setToken(d.token);
        state.me = d.user;
        $('#p').value = '';
        boot();
      })
      .catch(function (e) { $('#login-msg').textContent = e.message; })
      .finally(function () { $('#login-btn').disabled = false; });
  }

  $('#logout').addEventListener('click', function () {
    api('/api/ops/auth/logout', { method: 'POST' }).catch(function () {}).then(function () {
      setToken(''); showLogin('');
    });
  });

  // ---------------- 导航 ----------------
  $$('.nav-item').forEach(function (b) {
    b.addEventListener('click', function () {
      location.hash = '#/' + b.dataset.view;
      $('#sidebar').classList.remove('open');
    });
  });
  function route() {
    var v = (location.hash || '').replace(/^#\//, '') || 'dashboard';
    if (['dashboard', 'users', 'invites', 'logins', 'models', 'ai', 'account'].indexOf(v) < 0) v = 'dashboard';
    state.view = v;
    $$('.nav-item').forEach(function (b) { b.classList.toggle('on', b.dataset.view === v); });
    render();
  }
  window.addEventListener('hashchange', route);

  var TITLES = {
    dashboard: ['概览', '站点运行状况与最近动静'],
    users: ['用户管理', '查看每个用户的对话与画像'],
    invites: ['邀请码', '一人一码，注册时必须对上昵称'],
    logins: ['登录记录', '用户与管理员的登录审计'],
    models: ['模型切换', '决定每个厂商实际使用哪个模型'],
    ai: ['AI 管理', '把站内数据同步进 IMA 知识库，再向它提问'],
    account: ['账号与密码', '修改后台登录凭据']
  };

  // ---------------- 渲染分发 ----------------
  function render() {
    var t = TITLES[state.view] || TITLES.dashboard;
    $('#page-title').textContent = t[0];
    $('#page-desc').textContent = t[1];
    var fn = { dashboard: viewDashboard, users: viewUsers, invites: viewInvites, logins: viewLogins, models: viewModels, ai: viewAI, account: viewAccount }[state.view];
    $('#page').innerHTML = '<div class="empty">加载中…</div>';
    fn().catch(function (e) {
      if (e.message !== 'unauthorized') $('#page').innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
    });
  }

  // ---------------- 概览 ----------------
  function viewDashboard() {
    return api('/api/ops/overview').then(function (s) {
      $('#nav-users').textContent = s.users || 0;
      $('#nav-invites').textContent = s.invites_unused || 0;
      return api('/api/ops/logins?limit=8').then(function (lg) {
        var rows = (lg.events || []).map(function (e) {
          return '<tr><td>' + esc(when(e.at)) + '</td><td>' +
            (e.actor === 'admin' ? '<span class="badge outline">管理员</span>' : '<span class="badge outline">用户</span>') +
            '</td><td class="wrap-any">' + esc(e.email || '—') + '</td><td>' +
            (e.ok ? '<span class="badge ok">成功</span>' : '<span class="badge bad">失败</span>') +
            '</td><td class="mono-cell">' + esc(e.ip || '—') + '</td></tr>';
        }).join('');
        $('#page').innerHTML =
          '<div class="grid-4">' +
            statCard('用户', s.users || 0) +
            statCard('可用邀请码', s.invites_unused || 0) +
            statCard('记忆条目', s.memories || 0) +
            statCard('24h 登录', s.logins_24h || 0) +
          '</div>' +
          (s.mongo ? '' : '<div class="card" style="margin-top:14px"><div class="card-t">Mongo 未连接</div><div class="card-d">用户列表与对话追踪不可用；模型切换、邀请码、登录记录不受影响。</div></div>') +
          '<div class="card" style="margin-top:14px">' +
            '<div class="card-h"><div><div class="card-t">最近登录</div><div class="card-d">最多 8 条</div></div>' +
            '<div class="spacer"></div><button class="btn outline sm" onclick="location.hash=\'#/logins\'">全部</button></div>' +
            (rows ? '<table class="tb"><thead><tr><th>时间</th><th>类型</th><th>账号</th><th>结果</th><th>IP</th></tr></thead><tbody>' + rows + '</tbody></table>'
                  : '<div class="empty">还没有登录记录</div>') +
          '</div>';
      });
    });
  }
  function statCard(k, v) {
    return '<div class="stat-card"><div class="stat-k">' + esc(k) + '</div><div class="stat-v">' + esc(v) + '</div></div>';
  }

  // ---------------- 用户 ----------------
  function viewUsers() {
    return api('/api/ops/users').then(function (d) {
      state.users = d.users || [];
      $('#nav-users').textContent = state.users.length;
      if (d.mongo === false) {
        $('#page').innerHTML = '<div class="card"><div class="empty">' + esc(d.hint || 'Mongo 未连接') + '</div></div>';
        return;
      }
      var rows = state.users.map(function (u) {
        return '<tr>' +
          '<td>' + (u.role === 'ADMIN' ? '<span class="badge warn">管理员</span>' : '<span class="badge outline">用户</span>') + '</td>' +
          '<td><div style="font-weight:500">' + esc(u.name || u.username || '—') + '</div>' +
            '<div class="hint" style="margin:0">' + esc(u.email) + '</div></td>' +
          '<td>' + (u.memories || 0) + '</td>' +
          '<td>' + (u.last_login ? esc(ago(u.last_login.at)) : '<span class="hint">从未</span>') + '</td>' +
          '<td>' + esc(when(u.created_at)) + '</td>' +
          '<td><button class="btn outline sm" data-uid="' + esc(u.id) + '">查看</button></td>' +
        '</tr>';
      }).join('');

      $('#page').innerHTML =
        '<div class="card">' +
          '<div class="card-h"><div><div class="card-t">全部用户</div><div class="card-d">点「查看」进入对话与画像（只读，不能替你发消息）</div></div>' +
          '<div class="spacer"></div>' +
          '<input class="input" id="uq" placeholder="搜索邮箱 / 昵称" style="max-width:220px" />' +
          '</div>' +
          (rows ? '<table class="tb"><thead><tr><th>角色</th><th>用户</th><th>记忆</th><th>最近登录</th><th>注册</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
                : '<div class="empty">还没有用户</div>') +
        '</div>';

      $('#uq').addEventListener('keydown', function (e) {
        if (e.key !== 'Enter') return;
        var q = e.target.value.trim();
        $('#page').innerHTML = '<div class="empty">搜索中…</div>';
        api('/api/ops/users?q=' + encodeURIComponent(q)).then(function (r) {
          state.users = r.users || [];
          render();
        });
      });
      $$('[data-uid]').forEach(function (b) {
        b.addEventListener('click', function () { openUser(b.dataset.uid); });
      });
    });
  }

  function openUser(uid) {
    location.hash = '#/users';
    $('#page-title').textContent = '用户追踪';
    $('#page-desc').textContent = '对话、画像与记忆';
    $('#page').innerHTML = '<div class="empty">加载中…</div>';
    api('/api/ops/users/' + uid + '/conversations').then(function (d) {
      state.currentUser = d.user;
      var u = d.user, st = d.stats || {};
      var convos = (d.conversations || []).map(function (c) {
        return '<tr><td><div style="font-weight:500">' + esc(c.title) + '</div>' +
          '<div class="hint" style="margin:0">' + esc(c.model || c.endpoint || '') + '</div></td>' +
          '<td>' + esc(when(c.updated_at)) + '</td>' +
          '<td><button class="btn outline sm" data-cid="' + esc(c.id) + '">只读查看</button></td></tr>';
      }).join('');

      $('#page').innerHTML =
        '<div class="card">' +
          '<div class="card-h">' +
            '<button class="btn ghost sm" id="back-users">← 返回</button>' +
            '<div><div class="card-t">' + esc(u.name || u.email) + '</div><div class="card-d">' + esc(u.email) + '</div></div>' +
            '<div class="spacer"></div>' +
            '<span class="badge outline">注册 ' + esc(when(u.created_at)) + '</span>' +
          '</div>' +
          '<div class="grid-4">' +
            statCard('对话', st.conversations || 0) +
            statCard('消息', st.messages || 0) +
            statCard('最早', st.first_at ? when(st.first_at).slice(5, 10) : '—') +
            statCard('最近', st.last_at ? ago(st.last_at) : '—') +
          '</div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="tabs">' +
            '<button class="tab on" data-tab="convos">对话记录</button>' +
            '<button class="tab" data-tab="insight">画像与记忆</button>' +
          '</div>' +
          '<div id="tab-convos">' +
            (convos ? '<table class="tb"><thead><tr><th>标题</th><th>更新时间</th><th></th></tr></thead><tbody>' + convos + '</tbody></table>'
                    : '<div class="empty">这个人还没有对话</div>') +
          '</div>' +
          '<div id="tab-insight" class="hidden"><div class="empty">加载中…</div></div>' +
        '</div>';

      $('#back-users').addEventListener('click', function () { location.hash = '#/users'; render(); });
      $$('[data-cid]').forEach(function (b) {
        b.addEventListener('click', function () { openConvo(uid, b.dataset.cid); });
      });
      $$('.tab').forEach(function (t) {
        t.addEventListener('click', function () {
          $$('.tab').forEach(function (x) { x.classList.remove('on'); });
          t.classList.add('on');
          $('#tab-convos').classList.toggle('hidden', t.dataset.tab !== 'convos');
          $('#tab-insight').classList.toggle('hidden', t.dataset.tab !== 'insight');
          if (t.dataset.tab === 'insight') loadInsight(uid);
        });
      });
    }).catch(function (e) {
      $('#page').innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
    });
  }

  function openConvo(uid, cid) {
    $('#page').innerHTML = '<div class="empty">加载中…</div>';
    api('/api/ops/users/' + uid + '/conversations/' + cid).then(function (d) {
      var msgs = (d.messages || []).map(function (m) {
        /* 为什么这里要分三段渲染：
         *
         * AI 的消息在库里可能只有 content 数组、text 为空（新版 LibreChat 的写法），
         * 也可能是一次失败请求只留下 error。原来统一显示"（空）"，
         * 看起来像数据丢了，实际上：
         *   · 有 thinking 没 text  → 模型只输出了思考过程就被截断
         *   · 有 error_text        → 当时上游报错
         * 分开标出来，审阅时才能判断是"用户没聊"还是"系统出问题"。
         */
        var body = '';
        if (m.text) {
          body = '<div class="msg-main">' + esc(m.text) + '</div>';
        }
        if (m.thinking) {
          body += '<details class="msg-think"><summary>思考过程</summary>' +
                  '<div>' + esc(m.thinking) + '</div></details>';
        }
        if (m.error_text) {
          body += '<div class="msg-err">请求失败：' + esc(m.error_text) + '</div>';
        }
        if (!m.text && !m.thinking && !m.error_text) {
          // 确实什么都没有：可能是空回复，也可能是被中断
          body = '<div class="msg-empty">（本条无内容，可能被中断）</div>';
        }
        return '<div class="msg">' +
          '<div class="msg-role ' + (m.from === 'user' ? 'user' : '') + '">' + (m.from === 'user' ? '用户' : '助手') + '</div>' +
          '<div class="msg-body">' + body +
            '<div class="msg-time">' + esc(when(m.at)) + (m.model ? ' · ' + esc(m.model) : '') + '</div>' +
          '</div></div>';
      }).join('');
      $('#page-title').textContent = '对话详情';
      $('#page').innerHTML =
        '<div class="card">' +
          '<div class="card-h">' +
            '<button class="btn ghost sm" id="back-user">← 返回</button>' +
            '<div><div class="card-t">只读</div><div class="card-d">共 ' + (d.message_count || 0) + ' 条消息，无法在此发送</div></div>' +
            '<div class="spacer"></div>' +
            '<span class="badge outline">' + esc(cid.slice(0, 8)) + '</span>' +
          '</div>' +
          (d.compressed ? '<div class="card-d" style="margin-bottom:10px">这段对话已被压缩，摘要：' + esc(d.summary) + '</div>' : '') +
          (msgs ? msgs : '<div class="empty">没有消息</div>') +
        '</div>';
      $('#back-user').addEventListener('click', function () { openUser(uid); });
    }).catch(function (e) {
      $('#page').innerHTML = '<div class="card"><div class="empty">' + esc(e.message) + '</div></div>';
    });
  }

  var LAYER = { identity: '身份', preference: '偏好', experience: '经验', activity: '进行中', context: '上下文' };

  function loadInsight(uid) {
    var box = $('#tab-insight');
    api('/api/ops/users/' + uid + '/insight').then(function (d) {
      var p = d.profile || {};

      /* 画像的五组字段都是 [{k,v}] 列表，不是字符串。
       * 以前这里图省事 JSON.stringify 一把梭，后台就显示成
       * `[{"k":"身份","v":"zvima，开发者/编程学习者…`——
       * 数据是对的，但对人来说等于没渲染。用户侧记忆板块早就按 k/v 排版了，
       * 站长这边必须一样看得懂：两边是同一份数据的两个视图，不能一边好读一边是原始 JSON。 */
      function kvRows(arr) {
        return (arr || []).map(function (it) {
          if (!it || it.v == null || it.v === '') return '';
          return '<dt>' + esc(it.k || '') + '</dt><dd>' + esc(it.v) + '</dd>';
        }).join('');
      }
      var GROUPS = [
        ['身份与状态', p.basics],
        ['性格与习惯', p.traits],
        ['在意的东西', p.interests],
        ['看重什么', p.values],
        ['正在做', p.ongoing],
      ];
      var SECTION_ID = {
        '身份与状态': 'basics', '性格与习惯': 'traits',
        '在意的东西': 'interests', '看重什么': 'values', '正在做': 'ongoing'
      };
      var kv = GROUPS.map(function (g) {
        var rows = kvRows(g[1]);
        var sid = SECTION_ID[g[0]];
        // 空组也要留一个可点的入口：画像是模型生成的，某组为空时
        // 站长最需要的恰恰是"手动补一条"，而不是看着"没有这一组"没处下手。
        return '<div style="margin-bottom:14px" data-sec="' + sid + '">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">' +
            '<div class="card-t" style="margin:0;font-size:13px">' + g[0] + '</div>' +
            '<button class="btn ghost sm" data-act="sec-edit" data-id="' + sid + '">改</button>' +
          '</div>' +
          (rows ? '<dl class="kv">' + rows + '</dl>' : '<div class="hint">（空）</div>') +
        '</div>';
      }).join('');
      var headline = p.headline ? '<div style="font-size:15px;font-weight:600;line-height:1.6;margin-bottom:12px">' + esc(p.headline) + '</div>' : '';
      var born = p.generated_at
        ? '<div class="hint" style="margin-top:10px">生成于 ' + esc(when(p.generated_at)) +
          (p.built_from ? '　依据 ' + (p.built_from.memories || 0) + ' 条记忆' +
            (p.built_from.manual ? '（含他手写的 ' + p.built_from.manual + ' 条）' : '') +
            ' / ' + (p.built_from.topics || 0) + ' 个话题 / ' +
            (p.built_from.conversations || 0) + ' 段对话' : '') +
          '</div>'
        : '';

      var mem = (d.long_term || []).map(function (m) {
        return '<div style="padding:9px 0;border-bottom:1px solid var(--border)" data-mem="' + esc(m.id) + '">' +
          '<div style="display:flex;gap:8px;align-items:flex-start">' +
            '<div style="flex:1;min-width:0">' +
              '<span class="chip ' + esc(m.layer) + '">' + esc(LAYER[m.layer] || m.layer) + '</span> ' +
              '<span style="font-size:13px">' + esc(m.text) + '</span>' +
              '<div class="hint" style="margin-top:3px">' + esc(when(m.created_at)) +
                ' · 置信度 ' + (Math.round((m.confidence || 0) * 100) / 100) + '</div>' +
            '</div>' +
            '<div style="display:flex;gap:4px;flex-shrink:0">' +
              '<button class="btn ghost sm" data-act="mem-edit" data-id="' + esc(m.id) + '">改</button>' +
              '<button class="btn ghost sm" data-act="mem-del" data-id="' + esc(m.id) + '">删</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') || '<div class="empty">还没有长期记忆</div>';

      var topics = (d.topics || []).map(function (t) {
        return '<div style="padding:8px 0;border-bottom:1px solid var(--border)" data-topic="' + esc(t.id) + '">' +
          '<div style="display:flex;gap:8px;align-items:flex-start">' +
            '<div style="flex:1;min-width:0">' +
              '<div style="font-weight:500;font-size:13px">' + esc(t.title) +
                '<span class="hint">　' + (t.conv_count || 0) + ' 段</span></div>' +
              '<div class="hint">' + esc(t.summary || '（无摘要）') + ' · ' + esc(when(t.started_at)) + '</div>' +
            '</div>' +
            '<div style="display:flex;gap:4px;flex-shrink:0">' +
              '<button class="btn ghost sm" data-act="topic-edit" data-id="' + esc(t.id) + '">改</button>' +
              '<button class="btn ghost sm" data-act="topic-del" data-id="' + esc(t.id) + '">删</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') || '<div class="empty">还没有话题</div>';

      // 时间线：和用户自己记忆板块里的那一份是同一份数据（d.days）
      var timeline = (d.days || []).slice(0, 60).map(function (day) {
        var convs = (day.conversations || []).map(function (c) {
          return '<div style="font-size:12.5px;margin-top:4px;display:flex;gap:6px;align-items:flex-start">' +
            '<div style="flex:1;min-width:0">' +
              '<b>' + esc(c.title || '（无标题）') + '</b>' +
              (c.one_line ? ' <span class="hint">' + esc(c.one_line) + '</span>' : '') +
            '</div>' +
            '<button class="btn ghost sm" data-act="digest-edit" data-id="' + esc(c.id) + '">改</button>' +
          '</div>';
        }).join('');
        return '<div style="padding:9px 0;border-bottom:1px solid var(--border)">' +
          '<div class="hint mono" style="margin:0">' + esc(day.date) + ' · ' +
            (day.conversations || []).length + ' 段对话</div>' + convs + '</div>';
      }).join('') || '<div class="empty">还没有时间线</div>';

      var short = (d.short_term || []).map(function (s) {
        return '<div style="padding:8px 0;border-bottom:1px solid var(--border)">' +
          '<div class="hint mono" style="margin:0">' + esc(String(s.conversation_id).slice(0, 8)) + ' · ' + (s.covered_messages || 0) + ' 条被压缩</div>' +
          '<div style="font-size:12.5px">' + esc(s.summary) + '</div></div>';
      }).join('') || '<div class="empty">还没有压缩摘要</div>';

      var rev = d.review;
      var reviewHtml = rev
        ? '<div style="font-size:13px;line-height:1.7">' + esc(rev.summary) + '</div>' +
          '<div style="margin-top:8px">' + (rev.tags || []).map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join('') + '</div>' +
          '<div class="hint">生成于 ' + esc(when(rev.generated_at)) + '</div>'
        : '<div class="hint">还没有评价。点下方按钮，用便宜模型读一遍他的对话与记忆后生成。</div>';

      box.innerHTML =
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-h"><div><div class="card-t">记忆整理</div>' +
            '<div class="card-d">把历史对话读一遍：抽取记忆 → 归纳话题 → 摊开时间线 → 合成画像。只读，不改消息</div></div>' +
            '<div class="spacer"></div><button class="btn outline sm" id="build-mem">开始整理</button></div>' +
          '<div class="hint" id="build-state">' + (d.job ? '' : '还没有整理过') + '</div>' +
        '</div>' +
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-h"><div><div class="card-t">用户评价</div><div class="card-d">基于对话与记忆的客观归纳，不是人品判断</div></div>' +
          '<div class="spacer"></div><button class="btn outline sm" id="gen-review">' + (rev ? '重新生成' : '生成评价') + '</button></div>' +
          reviewHtml +
        '</div>' +
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-t" style="margin-bottom:10px">全局画像</div>' +
          (kv || headline ? headline + kv + born : '<div class="empty">还没有结构化画像，点上面的「重新整理」生成</div>') +
        '</div>' +
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-t" style="margin-bottom:8px">长期记忆 <span class="hint">（' + (d.long_term || []).length + ' 条，全局）</span></div>' + mem +
        '</div>' +
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-t" style="margin-bottom:8px">话题记忆</div>' + topics +
        '</div>' +
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-t" style="margin-bottom:8px">记忆时间线 <span class="hint">（按天，最多 60 天）</span></div>' + timeline +
        '</div>' +
        '<div class="card">' +
          '<div class="card-t" style="margin-bottom:8px">短期上下文 <span class="hint">（被压缩过的会话摘要）</span></div>' + short +
          '<div class="hint" style="margin-top:10px">IMA 知识库：' + esc((d.ima || {}).hint || '未接入') + '</div>' +
        '</div>';

      $('#gen-review').addEventListener('click', function () {
        var b = this;
        b.disabled = true; b.textContent = '生成中…';
        api('/api/ops/users/' + uid + '/review', { method: 'POST', body: { force: true } })
          .then(function () { toast('已生成'); loadInsight(uid); })
          .catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '重新生成'; });
      });

      bindBuild(uid);
      bindEdits(uid, d);
      if (d.job) showJob(uid, d.job, d.stats);
      else if (d.stats && d.stats.memories) {
        /* 没跑过整理但库里已经有记忆（比如用导入功能写的），也要说清楚现状，
         * 否则只显示"还没有整理过"，站长会以为一条记忆都没抽出来。 */
        var st0 = $('#build-state');
        if (st0) st0.innerHTML = '现存 ' + (d.stats.memories || 0) + ' 条记忆 · ' +
          (d.stats.topics || 0) + ' 个话题 · ' + (d.stats.days || 0) + ' 天';
      }
    }).catch(function (e) {
      box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  }

  /* 站长侧的四类编辑：记忆、话题、时间线条目、画像分组。
   *
   * 写的是和用户自己点按钮时**同一条更正记录**（memory_corrections）——
   * 对"下次重新生成时以谁为准"来说，是谁按的按钮不重要，
   * 重要的是"这条被明确否决/更正过"。note 里会标上操作人，事后可查。
   *
   * 用事件委托而不是逐个绑定：这几个列表是整块 innerHTML 重绘的，
   * 逐个 addEventListener 一刷新就全丢，表现为"第一次能点、刷新后点不动"。 */
  function bindEdits(uid, d) {
    var box = $('#tab-insight');
    if (!box || box.getAttribute('data-bound') === '1') return;
    box.setAttribute('data-bound', '1');

    box.addEventListener('click', function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var act = b.getAttribute('data-act');
      var id = b.getAttribute('data-id');

      if (act === 'mem-edit') {
        var row = box.querySelector('[data-mem="' + id + '"]');
        var cur = row ? (row.querySelector('span[style*="font-size:13px"]') || {}).textContent || '' : '';
        askText({
          title: '改这条记忆', value: cur.trim(),
          hint: '改完会重新向量化，并记成一次更正 —— 下次整理时以你写的为准，原标题不会再被抽出来。'
        }).then(function (v) {
          if (v == null) return;
          if (!v.trim()) { toast('内容不能为空'); return; }
          api('/api/ops/users/' + uid + '/memories/' + id, {
            method: 'PATCH', body: { text: v.trim() }
          }).then(function () { toast('已保存'); loadInsight(uid); })
            .catch(function (err) { toast(err.message); });
        });
        return;
      }

      if (act === 'mem-del') {
        if (!confirm('删除这条记忆？\n\n删除会被记为一次更正，下次整理不会再写回来。')) return;
        api('/api/ops/users/' + uid + '/memories/' + id, { method: 'DELETE' })
          .then(function () { toast('已删除'); loadInsight(uid); })
          .catch(function (err) { toast(err.message); });
        return;
      }

      if (act === 'topic-edit') {
        var t = (d.topics || []).filter(function (x) { return x.id === id; })[0] || {};
        askText({
          title: '改话题标题', value: t.title || '', rows: 2,
          hint: '只有标题会改。要改摘要请用下面的框。'
        }).then(function (v1) {
          if (v1 == null) return;
          return askText({
            title: '改话题摘要', value: t.summary || '', rows: 4,
            hint: '这两次改动都会记成更正，下次整理时优先采纳。'
          }).then(function (v2) {
            if (v2 == null) return;
            return api('/api/ops/users/' + uid + '/topics/' + id, {
              method: 'PATCH', body: { title: v1.trim(), summary: v2.trim() }
            }).then(function () { toast('已保存'); loadInsight(uid); });
          });
        }).catch(function (err) { toast(err.message); });
        return;
      }

      if (act === 'topic-del') {
        if (!confirm('删除这个话题？\n\n只是取消"把这几段归在一起"的归纳，对话和记忆都不会删。')) return;
        api('/api/ops/users/' + uid + '/topics/' + id, { method: 'DELETE' })
          .then(function () { toast('已删除'); loadInsight(uid); })
          .catch(function (err) { toast(err.message); });
        return;
      }

      if (act === 'digest-edit') {
        var all = [];
        (d.days || []).forEach(function (day) {
          (day.conversations || []).forEach(function (c) { all.push(c); });
        });
        var cur2 = all.filter(function (x) { return x.id === id; })[0] || {};
        askText({
          title: '改这一条的时间线描述', value: cur2.one_line || '', rows: 3,
          hint: '只改"它被怎么描述"，不动原始对话。标题：' + (cur2.title || '（无标题）')
        }).then(function (v) {
          if (v == null) return;
          api('/api/ops/users/' + uid + '/digests/' + id, {
            method: 'PATCH', body: { one_line: v.trim() }
          }).then(function () { toast('已保存'); loadInsight(uid); })
            .catch(function (err) { toast(err.message); });
        });
        return;
      }

      if (act === 'sec-edit') {
        var LABEL = {
          basics: '身份与状态', traits: '性格与习惯', interests: '在意的东西',
          values: '看重什么', ongoing: '正在做'
        };
        var arr = (d.profile || {})[id] || [];
        var lines = arr.map(function (it) { return (it.k || '') + ' | ' + (it.v || ''); });
        askText({
          title: '改「' + (LABEL[id] || id) + '」', value: lines.join('\n'), rows: 8,
          hint: '一行一条，格式「名称 | 内容」。删掉一行就是删掉这条。这些改动会被记成更正，下次重新生成时优先采纳。'
        }).then(function (v) {
          if (v == null) return;
          var items = [];
          v.split('\n').forEach(function (line) {
            line = line.trim();
            if (!line) return;
            var i2 = line.indexOf('|');
            if (i2 < 0) { items.push({ k: '', v: line }); return; }
            items.push({ k: line.slice(0, i2).trim(), v: line.slice(i2 + 1).trim() });
          });
          api('/api/ops/users/' + uid + '/profile', {
            method: 'PATCH', body: { section: id, items: items }
          }).then(function () { toast('已保存'); loadInsight(uid); })
            .catch(function (err) { toast(err.message); });
        });
        return;
      }
    });
  }

  /* 记忆整理：起任务 + 轮询进度。
   * 进度存在库里而不是进程里，所以关掉页面、明天再进来还能看到"上次整理完成"。 */
  function bindBuild(uid) {
    var b = $('#build-mem');
    if (!b) return;
    b.addEventListener('click', function () {
      b.disabled = true; b.textContent = '已启动';
      api('/api/ops/users/' + uid + '/memory/rebuild', { method: 'POST', body: {} })
        .then(function (d) { toast('已开始整理'); if (d.job) showJob(uid, d.job); })
        .catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '开始整理'; });
    });
  }

  function showJob(uid, j, live) {
    var el = $('#build-state');
    var b = $('#build-mem');
    if (!el) return;
    var pct = j.total ? Math.round((j.done || 0) * 100 / j.total) : 0;
    if (j.status === 'running') {
      el.innerHTML = '整理中：' + esc(j.stage || '') + '　' + (j.done || 0) + ' / ' + (j.total || 0) +
        (pct ? '　' + pct + '%' : '');
      if (b) { b.disabled = true; b.textContent = '整理中…'; }
      setTimeout(function () {
        if (!$('#build-state')) return;
        api('/api/ops/users/' + uid + '/memory/job')
          .then(function (d) { if (d.job) showJob(uid, d.job, live); })
          .catch(function () { /* 下一次轮询会补上 */ });
      }, 3000);
      return;
    }
    if (j.status === 'failed') {
      el.innerHTML = '上次整理失败：' + esc(j.error || '未知原因');
      if (b) { b.disabled = false; b.textContent = '重新整理'; }
      return;
    }
    var st = j.stats || {};
    /* 增量重整时 done=0、st.memories 也可能是当轮的增量，直接念出来会变成
     * "读了 0 段对话 · 现有 0 条记忆"，而他明明有 277 条 —— 自己吓自己。
     * 所以记忆/话题这类"总量"优先用实时统计，增量数字只在真的读了才提。 */
    var total = (live && live.memories) || st.memories || 0;
    var topicsN = (live && live.topics) || st.topics || 0;
    el.innerHTML = '上次整理完成：' +
      (j.done ? '本轮读 ' + j.done + ' 段对话 · ' : '本轮没有新对话 · ') +
      '现存 ' + total + ' 条记忆' +
      (topicsN ? ' · ' + topicsN + ' 个话题' : '') +
      (st.profile ? ' · 画像已更新' : '') + '　' + esc(when(j.updated_at));
    if (b) { b.disabled = false; b.textContent = '重新整理'; }
  }

  // ---------------- AI 管理（IMA） ----------------

  /* 这个页面的职责很窄：选知识库 → 把数据库推上去 → 对着它提问。
   *
   * 为什么不在这里放"检索参数"之类的开关：IMA 的检索是它自己的事，
   * 我们调参数只会让结果更像自建 RAG，而不像用户要的"用 IMA 的生态"。
   * 能调的只有"传什么"和"问什么"。
   */
  function viewAI() {
    return Promise.all([
      api('/api/ops/ima/status').catch(function (e) { return { configured: false, error: e.message }; }),
      api('/api/ops/users').catch(function () { return { users: [] }; }),
      api('/api/ops/ima/docs').catch(function () { return { docs: [] }; }),
    ]).then(function (res) {
      var st = res[0] || {};
      var users = (res[1] || {}).users || [];
      var docs = (res[2] || {}).docs || [];
      var kbs = st.knowledge_bases || [];
      var savedKb = '';
      try { savedKb = localStorage.getItem('umf:ima-kb') || ''; } catch (e) {}
      // 服务端按 IMA_KB_NAME 给出了默认知识库，没存过选择就直接用它，
      // 省掉"每次进来都要先挑一遍"的步骤。
      if (!savedKb) savedKb = st.default_kb_id || '';

      var kbOpts = kbs.map(function (k) {
        return '<option value="' + esc(k.kb_id) + '"' + (k.kb_id === savedKb ? ' selected' : '') + '>' +
          esc(k.name || k.kb_id) + '（' + (k.count || 0) + ' 条）</option>';
      }).join('');

      var userOpts = users.map(function (u) {
        return '<option value="' + esc(u.id) + '">' + esc(u.name || u.email || u.id) + '</option>';
      }).join('');

      var docRows = docs.slice(0, 60).map(function (d) {
        var badge = d.error
          ? '<span class="badge bad">失败</span>'
          : (d.media_id ? '<span class="badge ok">已上传</span>' : '<span class="badge outline">未上传</span>');
        return '<tr><td>' + esc(d.title) + '</td><td>' + badge + '</td>' +
          '<td class="hint">' + (d.bytes ? Math.round(d.bytes / 1024) + ' KB' : '—') + '</td>' +
          '<td class="hint">' + esc(d.synced_at ? when(d.synced_at) : '—') + '</td>' +
          '<td class="hint">' + esc((d.error || '').slice(0, 60)) + '</td></tr>';
      }).join('');

      var warn = '';
      if (!st.configured) {
        warn = '<div class="card" style="border-color:var(--warning)">' +
          '<div class="card-t" style="color:var(--warning)">还没配置 IMA 凭证</div>' +
          '<div class="card-d" style="margin-top:6px">' +
            '在服务器的 <span class="mono">.env</span> 里填两行，然后重启 brain：<br>' +
            '<span class="mono">IMA_CLIENT_ID=你的ClientID</span><br>' +
            '<span class="mono">IMA_API_KEY=你的APIKey</span><br>' +
            '凭证在 <a href="https://ima.qq.com/agent-interface" target="_blank" rel="noreferrer" ' +
            'style="color:var(--primary)">ima.qq.com/agent-interface</a> 获取。' +
          '</div></div>';
      } else if (st.ok === false) {
        warn = '<div class="card" style="border-color:var(--destructive)">' +
          '<div class="card-t" style="color:var(--destructive)">连不上 IMA</div>' +
          '<div class="card-d" style="margin-top:6px">' + esc(st.error || '') + '</div></div>';
      }

      $('#page').innerHTML =
        warn +
        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-h"><div><div class="card-t">IMA 知识库</div>' +
            '<div class="card-d">把站内数据整理成文档传到这里，提问时就由它检索</div></div></div>' +
          '<div class="row">' +
            '<select class="select" id="ima-kb" style="flex:1;min-width:200px">' +
              (kbOpts || '<option value="">（还没有可用的知识库）</option>') + '</select>' +
            '<button class="btn outline" id="ima-refresh">刷新列表</button>' +
          '</div>' +
          '<div class="hint" style="margin-top:8px">' +
            (st.synced_docs
              ? ('已同步 ' + st.synced_docs + ' 份文档，共 ' + Math.round((st.synced_bytes || 0) / 1024) + ' KB，最近 ' + when(st.last_sync))
              : '还没有同步过') +
            '<br>IMA 的接口只能新增、不能改也不能删：某份文档内容变了，同步上去会是<b>同名的新版本</b>，' +
            '旧的那份请在 IMA 客户端里手动删掉。' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:14px">' +
          '<div class="card-h"><div><div class="card-t">同步数据到 IMA</div>' +
            '<div class="card-d">站点总览 + 站点数据量（账号/会话/消息/附件）+ 运维明细（登录/导入/任务/更正）+ 每个用户的档案（画像/记忆/话题/时间线/活跃度）</div></div>' +
            '<div class="spacer"></div></div>' +
          '<div class="row">' +
            '<select class="select" id="ima-scope" style="flex:1;min-width:180px">' +
              '<option value="">全站 + 所有用户</option>' +
              (userOpts ? '<optgroup label="只同步某一个人">' + userOpts + '</optgroup>' : '') +
            '</select>' +
            '<label class="hint" style="display:flex;align-items:center;gap:6px;margin:0">' +
              '<input type="checkbox" id="ima-force"> 强制重传</label>' +
            '<button class="btn" id="ima-sync">开始同步</button>' +
          '</div>' +
          '<div class="hint" id="ima-prog" style="margin-top:10px"></div>' +
        '</div>' +

        '<div class="card ima-chat" id="ima-chat">' +
          '<div class="ima-side">' +
            '<div class="ima-side-h">' +
              '<div class="card-t">对话历史</div>' +
              '<div class="spacer"></div>' +
              '<button class="btn ghost sm" id="ima-new" title="新对话">＋</button>' +
            '</div>' +
            '<div class="ima-list" id="ima-list"></div>' +
          '</div>' +
          '<div class="ima-main">' +
            '<div class="ima-msgs" id="ima-msgs"></div>' +
            '<div class="ima-compose">' +
              '<textarea class="ta" id="ima-q" rows="2" ' +
                'placeholder="问点什么，例如：示例用户最近在忙什么？最近登录有没有异常？（Enter 发送，Shift+Enter 换行）"></textarea>' +
              '<div class="ima-compose-bar">' +
                '<button class="btn ghost sm only-mobile" id="ima-hist" title="历史对话">历史</button>' +
                '<select class="select" id="ima-ask-scope" style="max-width:168px;height:30px;font-size:12px">' +
                  '<option value="">全站视角</option>' +
                  (userOpts ? '<optgroup label="只看某个人">' + userOpts + '</optgroup>' : '') +
                '</select>' +
                '<span class="ima-hint" id="ima-ask-hint"></span>' +
                '<div class="spacer"></div>' +
                '<button class="btn sm" id="ima-send">发送</button>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-t" style="margin-bottom:10px">已同步的文档 <span class="hint">（最近 60 份）</span></div>' +
          (docRows ? '<table class="tb"><thead><tr><th>文档</th><th>状态</th><th>大小</th><th>同步时间</th><th>错误</th></tr></thead><tbody>' + docRows + '</tbody></table>'
                   : '<div class="empty">还没有同步记录</div>') +
        '</div>';

      var kbSel = $('#ima-kb');
      if (kbSel) kbSel.addEventListener('change', function () {
        try { localStorage.setItem('umf:ima-kb', this.value); } catch (e) {}
        // 换知识库 ≠ 换会话：已有的对话仍然读它自己那份库（会话里记着 kb_id），
        // 这里只影响"下一次新对话"用哪个库。
        imaChat.kb = this.value;
      });
      $('#ima-refresh').addEventListener('click', function () { render(); });

      $('#ima-sync').addEventListener('click', function () {
        var kb = $('#ima-kb').value;
        if (!kb) return toast('先选一个知识库');
        var scope = $('#ima-scope').value;
        var force = $('#ima-force').checked;
        var b = this; b.disabled = true; b.textContent = '同步中…';
        api('/api/ops/ima/sync', { method: 'POST', body: { kb_id: kb, user_id: scope || undefined, force: force } })
          .then(function (r) { pollImaJob(r.job_id); })
          .catch(function (e) { toast(e.message); b.disabled = false; b.textContent = '开始同步'; });
      });

      imaBindChat();
    });
  }

  /* ================================================================
   * 问 AI · 聊天区
   * ----------------------------------------------------------------
   * 为什么不是"一问一答一张卡"：
   *   排查问题永远是追着问的（"那第二个人呢""再细说失败原因"），
   *   每问一次就覆盖上一次的答案，等于把上下文丢了。
   *
   * 状态放在模块级 imaChat，而不是 viewAI 的闭包里：
   *   点开别的导航再回来，聊到一半的对话不能消失。
   *   真正的历史落库（ima_chats / ima_chat_msgs），换浏览器也能翻。
   */
  var imaChat = { chatId: null, messages: [], chats: [], busy: false, kb: '' };

  function imaScrollEnd() {
    var box = $('#ima-msgs');
    if (box) box.scrollTop = box.scrollHeight;
  }

  function imaBubble(m) {
    var user = m.role === 'user';
    var src = (m.sources || []).map(function (s) {
      return '<span class="chip" title="' + esc(s.media_id || '') + '">' + esc(s.title || '') + '</span>';
    }).join('');
    return '<div class="ima-turn ' + (user ? 'user' : 'ai') + '">' +
      '<div class="ima-bubble' + (m.pending ? ' pending' : '') + '">' + esc(m.content) + '</div>' +
      (src ? '<div class="ima-src">依据 ' + src + '</div>' : '') +
      '</div>';
  }

  function imaRenderMsgs() {
    var box = $('#ima-msgs');
    if (!box) return;
    if (!imaChat.messages.length) {
      box.innerHTML = '<div class="empty">' +
        '问点什么吧。比如「示例用户最近在忙什么」「最近登录有没有异常」「站点一共多少条消息」<br>' +
        '<span class="hint">回答依据来自 IMA 知识库，每轮都会重新取资料；追问会带上前面的对话。</span>' +
        '</div>';
    } else {
      box.innerHTML = imaChat.messages.map(imaBubble).join('');
    }
    imaScrollEnd();
  }

  function imaRenderList() {
    var box = $('#ima-list');
    if (!box) return;
    if (!imaChat.chats.length) {
      box.innerHTML = '<div class="hint" style="padding:8px 6px">还没有对话</div>';
      return;
    }
    box.innerHTML = imaChat.chats.map(function (c) {
      return '<button class="ima-item' + (c.id === imaChat.chatId ? ' on' : '') + '" data-chat="' + esc(c.id) + '">' +
        '<span class="t">' + esc(c.title || '新对话') + '</span>' +
        '<span class="x" data-del="' + esc(c.id) + '" title="删除">×</span>' +
        '</button>';
    }).join('');
  }

  function imaLoadChats(kb) {
    return api('/api/ops/ima/chats').then(function (d) {
      imaChat.chats = (d && d.chats) || [];
      if (kb) imaChat.kb = kb;
      imaRenderList();
      return imaChat.chats;
    }).catch(function () { imaChat.chats = []; imaRenderList(); return []; });
  }

  function imaOpenChat(id) {
    return api('/api/ops/ima/chats/' + encodeURIComponent(id)).then(function (d) {
      imaChat.chatId = id;
      imaChat.messages = (d.messages || []).map(function (m) {
        return { role: m.role, content: m.content, sources: m.sources || [] };
      });
      if (d.chat && d.chat.kb_id) imaChat.kb = d.chat.kb_id;
      var box = $('#ima-chat');
      if (box) box.classList.remove('show-list');
      imaRenderMsgs();
      imaRenderList();
    }).catch(function (e) { toast(e.message); });
  }

  function imaNewChat() {
    var kb = ($('#ima-kb') && $('#ima-kb').value) || imaChat.kb;
    if (!kb) return toast('先选一个知识库');
    // 不在这里建库记录：一个没问过话的空会话只会让历史列表变脏。
    // 真正创建发生在第一次发送时（服务端按需建）。
    imaChat.chatId = null;
    imaChat.messages = [];
    imaChat.kb = kb;
    imaRenderMsgs();
    imaRenderList();
    var q = $('#ima-q');
    if (q) { q.value = ''; q.focus(); }
  }

  function imaSend() {
    if (imaChat.busy) return;
    var box = $('#ima-q');
    var q = (box && box.value || '').trim();
    if (!q) return;
    var kb = ($('#ima-kb') && $('#ima-kb').value) || imaChat.kb;
    if (!kb) return toast('先选一个知识库');
    var scope = $('#ima-ask-scope') ? $('#ima-ask-scope').value : '';
    var scopeName = scope ? (function () {
      var o = $('#ima-ask-scope').selectedOptions[0];
      return o ? o.textContent.trim() : '';
    })() : '';
    var full = scopeName ? ('关于用户「' + scopeName + '」：' + q) : q;

    imaChat.busy = true;
    box.value = '';
    imaChat.messages.push({ role: 'user', content: q });
    imaChat.messages.push({ role: 'assistant', content: '正在检索 IMA 知识库…', pending: true });
    imaRenderMsgs();
    var sendBtn = $('#ima-send');
    if (sendBtn) sendBtn.disabled = true;
    if ($('#ima-ask-hint')) $('#ima-ask-hint').textContent = '';

    function fail(msg) {
      imaChat.messages.pop();
      imaChat.messages.push({ role: 'assistant', content: '出错了：' + msg });
      imaRenderMsgs();
      imaChat.busy = false;
      if (sendBtn) sendBtn.disabled = false;
    }

    (imaChat.chatId ? Promise.resolve(imaChat.chatId) : api('/api/ops/ima/chats', { method: 'POST', body: { kb_id: kb } })
      .then(function (r) { imaChat.chatId = r.chat.id; return imaChat.chatId; }))
      .then(function (cid) {
        return api('/api/ops/ima/chats/' + encodeURIComponent(cid) + '/ask', { method: 'POST', body: { q: full } })
          .then(function (r) {
            imaChat.messages.pop();
            imaChat.messages.push({ role: 'assistant', content: r.answer, sources: r.sources || [] });
            imaRenderMsgs();
            imaChat.busy = false;
            if (sendBtn) sendBtn.disabled = false;
            if (r.chat && r.chat.title) {
              var hit = null;
              imaChat.chats.forEach(function (c) { if (c.id === r.chat.id) hit = c; });
              if (hit) hit.title = r.chat.title;
              imaLoadChats();
            }
          });
      })
      .catch(function (e) { fail(e.message); });
  }

  function imaBindChat() {
    var chat = $('#ima-chat');
    if (!chat) return;

    // 每次进这一页都重挂事件（DOM 是新生成的），但状态沿用模块级 imaChat。
    var kbSel = $('#ima-kb');
    var kb = (kbSel && kbSel.value) || imaChat.kb;
    imaLoadChats(kb).then(function (list) {
      if (imaChat.chatId && list.some(function (c) { return c.id === imaChat.chatId; })) {
        imaOpenChat(imaChat.chatId);
      } else if (!imaChat.chatId && imaChat.messages.length) {
        imaRenderMsgs();      // 聊天中离开又回来：把还在的消息接着显示
      } else {
        imaChat.chatId = null;
        imaChat.messages = [];
        imaRenderMsgs();
      }
    });

    chat.addEventListener('click', function (e) {
      var del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        var id = del.getAttribute('data-del');
        if (!confirm('删除这个对话？消息会一起删掉，不能恢复。')) return;
        api('/api/ops/ima/chats/' + encodeURIComponent(id), { method: 'DELETE' }).then(function () {
          if (imaChat.chatId === id) { imaChat.chatId = null; imaChat.messages = []; imaRenderMsgs(); }
          imaLoadChats();
        }).catch(function (err) { toast(err.message); });
        return;
      }
      var item = e.target.closest('[data-chat]');
      if (item) imaOpenChat(item.getAttribute('data-chat'));
    });

    $('#ima-new').addEventListener('click', imaNewChat);
    $('#ima-send').addEventListener('click', imaSend);

    // 窄屏上历史列表默认收起，用「历史」按钮切出来。
    var hist = $('#ima-hist');
    if (hist) hist.addEventListener('click', function () { chat.classList.toggle('show-list'); });

    var q = $('#ima-q');
    q.addEventListener('keydown', function (e) {
      // Enter 发送、Shift+Enter 换行：和主流聊天框一致，
      // 否则每次问一句都要把手从键盘挪到鼠标上。
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        imaSend();
      }
    });
    q.addEventListener('input', function () {
      q.style.height = 'auto';
      q.style.height = Math.min(q.scrollHeight, 140) + 'px';
    });
    q.focus();
  }

  function pollImaJob(jobId) {
    var el = $('#ima-prog');
    api('/api/ops/ima/job/' + jobId).then(function (d) {
      var j = d.job || {};
      if (j.status === 'running') {
        if (el) el.innerHTML = esc(j.stage || '同步中') + '　' + (j.done || 0) + ' / ' + (j.total || 0);
        setTimeout(function () { pollImaJob(jobId); }, 1500);
        return;
      }
      var st = j.stats || {};
      if (el) {
        el.innerHTML = (j.status === 'failed' ? '<span style="color:var(--destructive)">同步失败：' + esc(j.error || '') + '</span>'
          : '完成：上传 ' + (st.uploaded || 0) + ' 份，跳过 ' + (st.skipped || 0) + ' 份' +
            (st.failed ? '，失败 ' + st.failed + ' 份' : ''));
      }
      var b = $('#ima-sync');
      if (b) { b.disabled = false; b.textContent = '开始同步'; }
      if (st.failed) toast('有 ' + st.failed + ' 份上传失败，见下方列表');
    }).catch(function () { setTimeout(function () { pollImaJob(jobId); }, 2000); });
  }

  // ---------------- 邀请码 ----------------
  function viewInvites() {
    return api('/api/ops/invites').then(function (d) {
      state.invites = d.invites || [];
      var unused = state.invites.filter(function (i) { return !i.used_at && !i.revoked; }).length;
      $('#nav-invites').textContent = unused;

      var rows = state.invites.map(function (i) {
        var st = i.revoked ? '<span class="badge bad">已作废</span>'
               : i.used_at ? '<span class="badge">已使用</span>'
               : '<span class="badge ok">可用</span>';
        return '<tr>' +
          '<td class="mono-cell" style="font-weight:600">' + esc(i.code) + '</td>' +
          '<td>' + esc(i.nickname) + '</td>' +
          '<td>' + st + '</td>' +
          '<td class="hint">' + (i.used_at ? esc(when(i.used_at)) + '<br>' + esc(i.used_email || '') : (i.expires_at ? '至 ' + esc(when(i.expires_at)) : '长期')) + '</td>' +
          '<td>' + esc(when(i.created_at)) + '</td>' +
          '<td>' + (!i.used_at && !i.revoked ? '<button class="btn destructive sm" data-revoke="' + esc(i.code) + '">作废</button>' : '') + '</td>' +
        '</tr>';
      }).join('');

      $('#page').innerHTML =
        '<div class="card">' +
          '<div class="card-h"><div><div class="card-t">新建邀请码</div><div class="card-d">一人一码，注册时昵称必须对上</div></div></div>' +
          '<div class="row">' +
            '<input class="input" id="iv-nick" placeholder="对方昵称（至少 3 个字）" style="flex:1;min-width:150px" />' +
            '<input class="input" id="iv-code" placeholder="自定义邀请码（留空自动生成）" ' +
              'style="flex:1;min-width:170px;text-transform:uppercase" spellcheck="false" autocomplete="off" />' +
            '<input class="input" id="iv-note" placeholder="备注（可选）" style="flex:1;min-width:130px" />' +
            '<select class="select" id="iv-days" style="max-width:130px">' +
              '<option value="0">长期有效</option><option value="7">7 天内</option><option value="30">30 天内</option>' +
            '</select>' +
            '<button class="btn" id="iv-add">生成</button>' +
          '</div>' +
          '<div class="hint" style="margin-top:8px">自定义码只能用字母、数字和短横线，' +
            '至少 4 位。手输的码更好记（比如朋友的名字），也更好念给对方听。</div>' +
          '<div id="iv-out" class="hint" style="margin-top:10px"></div>' +
        '</div>' +
        '<div class="card">' +
          '<div class="card-t" style="margin-bottom:10px">全部邀请码</div>' +
          (rows ? '<table class="tb"><thead><tr><th>邀请码</th><th>昵称</th><th>状态</th><th>使用 / 有效期</th><th>创建</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
                : '<div class="empty">还没有邀请码</div>') +
        '</div>';

      $('#iv-add').addEventListener('click', function () {
        var nick = $('#iv-nick').value.trim();
        if (!nick) return toast('先填昵称');
        var custom = ($('#iv-code').value || '').trim().toUpperCase();
        api('/api/ops/invites', {
          method: 'POST',
          body: {
            nickname: nick,
            code: custom || undefined,
            note: $('#iv-note').value.trim(),
            expires_days: Number($('#iv-days').value)
          }
        }).then(function (r) {
          $('#iv-out').innerHTML = (r.custom ? '已按你指定的码创建：' : '已生成：') +
            '<b class="mono" style="font-size:14px">' + esc(r.code) + '</b> （给 ' + esc(r.nickname) + '）';
          render();
        }).catch(function (e) { toast(e.message); });
      });
      // 手输码统一大写，避免"填了小写、登录时却要大写"的坑
      var ivc = $('#iv-code');
      if (ivc) {
        ivc.addEventListener('input', function () {
          var p = this.selectionStart;
          this.value = this.value.toUpperCase();
          try { this.setSelectionRange(p, p); } catch (e) {}
        });
      }

      $$('[data-revoke]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('作废后这个码就不能注册了，确定？')) return;
          api('/api/ops/invites/' + b.dataset.revoke + '/revoke', { method: 'POST' })
            .then(function () { toast('已作废'); render(); })
            .catch(function (e) { toast(e.message); });
        });
      });
    });
  }

  // ---------------- 登录记录 ----------------
  function viewLogins() {
    var st = state.loginsFilter || { actor: '', ok: '', q: '' };
    var qs = 'limit=200';
    if (st.actor) qs += '&actor=' + st.actor;
    if (st.ok) qs += '&ok=' + st.ok;
    if (st.q) qs += '&q=' + encodeURIComponent(st.q);

    return api('/api/ops/logins?' + qs).then(function (d) {
      var rows = (d.events || []).map(function (e) {
        return '<tr>' +
          '<td>' + esc(when(e.at)) + '</td>' +
          '<td>' + (e.actor === 'admin' ? '<span class="badge warn">管理员</span>' : '<span class="badge outline">用户</span>') + '</td>' +
          '<td class="wrap-any">' + esc(e.email || '—') + (e.reason ? '<div class="hint" style="margin:0">' + esc(e.reason) + '</div>' : '') + '</td>' +
          '<td>' + (e.ok ? '<span class="badge ok">成功</span>' : '<span class="badge bad">失败</span>') + '</td>' +
          '<td class="mono-cell">' + esc(e.ip || '—') + '</td>' +
          '<td class="hint" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(e.user_agent || '') + '</td>' +
        '</tr>';
      }).join('');

      $('#page').innerHTML =
        '<div class="card">' +
          '<div class="card-h"><div><div class="card-t">登录审计</div><div class="card-d">用户与管理员共用一张表；失败记录是唯一的入侵信号</div></div></div>' +
          '<div class="row">' +
            '<select class="select" id="lg-actor" style="max-width:130px">' +
